# Copy to config.yaml and edit. Secrets go in environment variables, never here.

database: tracker.db               # SQLite history, relative to this file

fetch:
  contact: yahanihwgm@gmail.com   # sent in the User-Agent so site owners can reach you
  timeout_seconds: 20

sites:
  - name: books-sandbox
    base_url: https://books.toscrape.com
    fetch_mode: http        # or: browser
    delay_seconds: 5
    selectors:
      title: "div.product_main h1"
      price: "div.product_main p.price_color"
      stock: "div.product_main p.availability"
    currency: GBP

  - name: scraping-dev
    base_url: https://web-scraping.dev
    fetch_mode: http
    delay_seconds: 5
    selectors:
      title: "h3.product-title"
      price: "span.product-price"
      stock: "button.add-to-cart"
    currency: USD

products:
  - site: books-sandbox
    url: https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html
    my_sku: BOOK-001
    my_price: 49.99

alerts:
  min_change_percent: 1
  always_send_summary: false
  email:
    enabled: true
    to: [owner@example.com]
  slack:
    enabled: false

sheets:
  enabled: false
  spreadsheet_id: ""                # the sheet's ID or full URL; share it with the service account
  observations_tab: Observations    # every check is appended here
  latest_tab: Latest                # rewritten each run: one row per product
