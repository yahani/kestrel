[project]
name = "price-tracker"
version = "1.0.0"
description = "Daily competitor price and stock tracker with change alerts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.7.22",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "soupsieve>=3.0.3",
    "typer>=0.12",
]

[project.scripts]
tracker = "tracker.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
